name: Vérification des sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrôler les fichiers publiés et les liens des manuels
        run: python scripts/check_publication.py
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q src scripts tests
      - name: Installer les dépendances des tests de données
        run: python -m pip install sqlalchemy numpy pyyaml opencv-python-headless
      - name: Vérifier taxonomie, sessions, CSV et événements COCO-VID
        run: python scripts/run_tests.py --core
